<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شجرة ويكيبيديا العربية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <button id="toggle-panel-btn" title="تصغير/تكبير">-</button>
        <div class="search-container">
            <h1>شجرة ويكيبيديا العربية</h1>
            <p>ابحث عن مقالة للبدء في تتبع مسار الروابط</p>
            <p>هل تعلم ان 97% من مقالات ويكيبيديا تنتهي سلسلة روابطها عند مقالة <a target="_blank" href="https://ar.wikipedia.org/wiki/%D8%B8%D8%A7%D9%87%D8%B1%D8%A9_%D8%A7%D9%84%D9%81%D9%84%D8%B3%D9%81%D8%A9_%D9%81%D9%8A_%D9%88%D9%8A%D9%83%D9%8A%D8%A8%D9%8A%D8%AF%D9%8A%D8%A7">فلسفة</a></p>
            <div class="input-wrapper">
                <input type="text" id="search-input" placeholder="ابحث عن مقالة..." autocomplete="off">
                <button id="random-btn" title="مقالة عشوائية">🎲</button>
                <button id="clear-btn" title="مسح الشجرة">🗑️</button>
                <ul id="autocomplete-list" class="hidden"></ul>
            </div>
            <div class="options-wrapper" style="margin-top: 10px; font-size: 0.9em;">
                <input type="checkbox" id="break-loops-checkbox" checked>
                <label for="break-loops-checkbox" title="عند التفعيل، سيحاول النظام تجاوز الحلقات باختيار الرابط الثاني أو الثالث إذا كان الأول يؤدي إلى حلقة">كسر الحلقات (تخطي الروابط المكررة)</label>
            </div>
            <div id="status-message"></div>
        </div>
    </div>
    
    <canvas id="tree-canvas"></canvas>

    <div class="developer-credit">
        تم تطوير الموقع بواسطة <a href="https://aliabdelrahman.me" target="_blank">علي عبدالرحمن</a> 
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
